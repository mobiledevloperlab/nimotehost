name: Agent compatibility monitor

on:
  schedule:
    # Daily at UTC 00:23; avoid the busy top of the hour.
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run checks even when upstream versions have not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-compatibility-monitor
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check published versions and previous result
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_FORCE: ${{ inputs.force || false }}
        run: python3 scripts/agent_compatibility.py detect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.detect.outputs.changed == 'true'
        with:
          name: agent-monitor-snapshot
          path: dist/agent-monitor/snapshot.json
          retention-days: 7

  check:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-monitor-snapshot
          path: dist/agent-monitor
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Run isolated CLI checks without model calls
        run: python3 scripts/agent_compatibility.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-monitor-checks
          path: |
            dist/agent-monitor/*.json
            dist/agent-monitor/*.log
            dist/agent-monitor/codex-schema
          retention-days: 7

  report:
    needs: [detect, check]
    if: always() && !cancelled() && needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-monitor-snapshot
          path: dist/agent-monitor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: agent-monitor-checks
          path: dist/agent-monitor/checks
      - name: Update the monitor issue
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_CHECK_RESULT: ${{ needs.check.result }}
        run: python3 scripts/agent_compatibility.py report
