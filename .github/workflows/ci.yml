name: Host CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Distribution version (starts with a digit)
        default: 2.4.0-dev
        required: true
permissions:
  contents: read
env:
  RELEASE_GO_VERSION: '1.27.4'
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Installer help (Unix)
        if: runner.os != 'Windows'
        run: sh scripts/install.sh --help
      - name: Installer help (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1 -Help
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: go mod verify
      - run: go test -mod=readonly -race ./...
      - run: go vet ./...
      - run: go run ./tools/build
  clean-source:
    strategy:
      matrix:
        go: [minimum, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ matrix.go == 'minimum' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          cache: false
      - run: sh scripts/check-clean-build.sh
  cross-build:
    env:
      HOST_VERSION: ${{ inputs.version || '2.4.0-dev' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: windows
            arch: "386"
          - os: linux
            arch: "386"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
      - name: Use tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: go run ./tools/build -os "$TARGET_OS" -arch "$TARGET_ARCH" -version "$HOST_VERSION"
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: nimotehost-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/nimotehost-*-${{ matrix.os }}-${{ matrix.arch }}.*

  source-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Export standalone source
        run: ./scripts/export-source.sh
      - name: Check exported documentation and export tests
        shell: bash
        run: |
          source_dir="$(mktemp -d)"
          tar -xzf dist/public/nimotehost-source.tar.gz -C "$source_dir"
          cd "$source_dir"
          python3 -m unittest discover -s test -p 'test_*.py'
          go test -mod=readonly ./...
          go run ./tools/build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: nimotehost-source
          path: dist/public/nimotehost-source.tar.gz

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HOST_VERSION: ${{ inputs.version || '2.4.0-dev' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache-dependency-path: |
            go.sum
            cmd/nimotehost-gui/go.sum
      - name: Windows x64 C compiler
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        shell: bash
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Windows ARM64 C compiler
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'CLANGARM64'
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-clang-aarch64-toolchain'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:/msys64/clangarm64/bin' >> $env:GITHUB_PATH
          'CC=clang' >> $env:GITHUB_ENV
          'CXX=clang++' >> $env:GITHUB_ENV
      - name: Use tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Native Host checks
        shell: bash
        run: |
          go test -mod=readonly ./...
          go vet ./...
      - name: Desktop unit checks
        working-directory: cmd/nimotehost-gui
        shell: bash
        run: |
          race=(-race)
          # Go's race detector does not support Windows ARM64.
          if [[ "$(go env GOOS)/$(go env GOARCH)" == "windows/arm64" ]]; then
            race=()
          fi
          go test -mod=readonly "${race[@]}" -tags ci ./...
          go vet ./...
      - name: Build CLI and native desktop bundle
        shell: bash
        run: go run ./tools/build -gui -version "$HOST_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: nimotehost-gui-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/nimotehost-gui-*-${{ matrix.os }}-${{ matrix.arch }}.*

  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      HOST_VERSION: ${{ inputs.version || '2.4.0-dev' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install baseline desktop dependencies
        run: apt-get update && apt-get install -y ca-certificates git gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols python3 binutils
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache-dependency-path: |
            go.sum
            cmd/nimotehost-gui/go.sum
      - name: Use tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Desktop unit checks
        working-directory: cmd/nimotehost-gui
        run: go test -mod=readonly -tags ci ./...
      - name: Build and inspect native GUI bundle
        shell: bash
        run: |
          go run ./tools/build -gui -version "$HOST_VERSION"
          python3 scripts/check-linux-glibc.py "dist/gui-linux-${{ matrix.arch }}/nimotehost-gui" 2.35
          ldd "dist/gui-linux-${{ matrix.arch }}/nimotehost-gui" | tee /tmp/nimotehost-ldd.txt
          ! grep -q 'not found' /tmp/nimotehost-ldd.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: nimotehost-gui-linux-${{ matrix.arch }}
          path: dist/nimotehost-gui-*-linux-${{ matrix.arch }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, clean-source, cross-build, source-export, desktop, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish both editions from this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
