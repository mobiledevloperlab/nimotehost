name: Host CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: Packages to build
        type: choice
        default: both
        options: [cli, gui, both]
      version:
        description: Distribution version (starts with a digit)
        default: 2.4.0-dev
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
permissions:
  contents: read
env:
  RELEASE_GO_VERSION: '1.27.4'
  HOST_VERSION: ${{ inputs.version || '2.4.0-dev' }}
jobs:
  native:
    name: native (ubuntu-latest)
    if: github.event_name != 'workflow_dispatch' || inputs.edition != 'gui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer help (Unix)
        run: sh scripts/install.sh --help
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: go mod verify
      - run: go test -mod=readonly -race ./...
      - run: go vet ./...
  desktop-tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/nimotehost-gui/go.mod
          cache-dependency-path: |
            go.sum
            cmd/nimotehost-gui/go.sum
      - name: Desktop unit checks
        working-directory: cmd/nimotehost-gui
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -tags ci ./...
  clean-source:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.edition != 'gui')
    strategy:
      matrix:
        go: [minimum, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'minimum' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          cache: false
      - run: sh scripts/check-clean-build.sh
  cross-build:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.edition != 'gui')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: windows
            arch: "386"
          - os: linux
            arch: "386"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
      - name: Use tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: go run ./tools/build -os "$TARGET_OS" -arch "$TARGET_ARCH" -version "$HOST_VERSION"
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          name: nimotehost-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/nimotehost-*-${{ matrix.os }}-${{ matrix.arch }}.*

  source-export:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.edition != 'gui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Export standalone source
        run: ./scripts/export-source.sh
      - name: Check exported documentation and export tests
        shell: bash
        run: |
          source_dir="$(mktemp -d)"
          tar -xzf dist/public/nimotehost-source.tar.gz -C "$source_dir"
          cd "$source_dir"
          python3 -m unittest discover -s test -p 'test_*.py'
          go test -mod=readonly ./...
          go run ./tools/build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          name: nimotehost-source
          path: dist/public/nimotehost-source.tar.gz

  desktop:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.edition != 'cli')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache-dependency-path: |
            go.sum
            cmd/nimotehost-gui/go.sum
      - name: Windows x64 C compiler
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        shell: bash
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Windows ARM64 C compiler
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'CLANGARM64'
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-clang-aarch64-toolchain'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:/msys64/clangarm64/bin' >> $env:GITHUB_PATH
          'CC=clang' >> $env:GITHUB_ENV
          'CXX=clang++' >> $env:GITHUB_ENV
      - name: Use tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Native Host and desktop checks
        shell: bash
        run: |
          race=(-race)
          # Go's race detector does not support Windows ARM64.
          if [[ "$(go env GOOS)/$(go env GOARCH)" == "windows/arm64" ]]; then
            race=()
          fi
          go test -mod=readonly "${race[@]}" ./...
          go vet ./...
          go -C cmd/nimotehost-gui test -mod=readonly "${race[@]}" -tags ci ./...
          go -C cmd/nimotehost-gui vet ./...
      - name: Installer help (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1 -Help
      - name: Build CLI and native desktop bundle
        shell: bash
        run: go run ./tools/build -gui -version "$HOST_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          name: nimotehost-gui-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/nimotehost-gui-*-${{ matrix.os }}-${{ matrix.arch }}.*

  linux-desktop:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.edition != 'cli')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install baseline desktop dependencies
        run: apt-get update && apt-get install -y ca-certificates git gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols python3 binutils
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache-dependency-path: |
            go.sum
            cmd/nimotehost-gui/go.sum
      - name: Use tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "HOST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Desktop unit checks
        working-directory: cmd/nimotehost-gui
        run: go test -mod=readonly -tags ci ./...
      - name: Build and inspect native GUI bundle
        shell: bash
        run: |
          go run ./tools/build -gui -version "$HOST_VERSION"
          python3 scripts/check-linux-glibc.py "dist/gui-linux-${{ matrix.arch }}/nimotehost-gui" 2.35
          ldd "dist/gui-linux-${{ matrix.arch }}/nimotehost-gui" | tee /tmp/nimotehost-ldd.txt
          ! grep -q 'not found' /tmp/nimotehost-ldd.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          name: nimotehost-gui-linux-${{ matrix.arch }}
          path: dist/nimotehost-gui-*-linux-${{ matrix.arch }}.*

  release-cli:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [native, clean-source, cross-build, source-export]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nimotehost-{linux,darwin,windows}-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nimotehost-source
          path: release-assets
      - name: Publish CLI packages and source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} != 17 )); then
            echo "Expected eight CLI archives with checksums and one source archive" >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check --strict -- *.sha256)
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            if [[ "$is_draft" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi

  release-gui:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release-cli, desktop, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nimotehost-gui-*
          path: release-assets
          merge-multiple: true
      - name: Add GUI packages to the same release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} != 12 )); then
            echo "Expected six GUI archives with checksums" >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check --strict -- *.sha256)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
